# gradle-plugins-ci.yml 

steps:
  - group: "amd64 Tests"
    steps:
      - label: ":pipeline: :gcloud: Gradle Check"
        commands:
          - 'export DEVELOCITY_ACCESS_KEY="gradle-enterprise.elastic.co=$${DEVELOCITY_API_ACCESS_KEY:?Vault did not inject DEVELOCITY_API_ACCESS_KEY}"'
          - "./gradlew check --continue"
        agents:
          provider: "gcp"
          image: family/cloud-ubuntu-2204
          diskSizeGb: 80
          machineType: 'custom-6-18432'
        plugins:
          - elastic/vault-secrets#v0.0.3:
              path: "kv/ci-shared/develocity/gradle-build-cache-access-key"
              field: "accesskey"
              env_var: "DEVELOCITY_API_ACCESS_KEY"
  - group: "arm64 Test"
    steps:
      - label: ":pipeline: :aws-logo:  Gradle Check"
        commands:
          - 'export DEVELOCITY_ACCESS_KEY="gradle-enterprise.elastic.co=$${DEVELOCITY_API_ACCESS_KEY:?Vault did not inject DEVELOCITY_API_ACCESS_KEY}"'
          - "./gradlew check --continue"
        agents:
          provider: "aws"
          diskSizeGb: 200
          instanceType: m6g.4xlarge
          imagePrefix: cloud-ubuntu-2204-aarch64
          diskName: "/dev/xvda"
        plugins:
          - elastic/vault-secrets#v0.0.3:
              path: "kv/ci-shared/develocity/gradle-build-cache-access-key"
              field: "accesskey"
              env_var: "DEVELOCITY_API_ACCESS_KEY"

  - wait

  # Keep the conditional on the group. Buildkite evaluates command-step
  # conditionals after plugins have run, which is too late for secret-bearing
  # release steps.
  - group: ":gradle: Publish tagged release"
    if: "build.tag != null"
    steps:
      - label: ":pipeline: :gcloud: Publish to Gradle Plugin Portal"
        command: ".buildkite/scripts/publish-plugins.sh"
        agents:
          provider: "gcp"
          image: family/cloud-ubuntu-2204
          diskSizeGb: 80
          machineType: 'n4-custom-6-18432'
          diskType: hyperdisk-balanced
